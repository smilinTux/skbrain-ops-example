# Copied into an instance repo as .forgejo/workflows/skbrain-check.yml by the
# generator. Runs the PINNED framework's check against this canon. Hermetic:
# no secrets, no network after checkout, no artifacts.
name: skbrain-check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  skbrain-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned framework
        run: pip install ./framework
      - name: Check the canon
        run: skbrain check --canon . --repo-name "${GITHUB_REPOSITORY##*/}"
      - name: Warn when the PR author is not a declared writer
        if: github.event_name == 'pull_request'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 - <<'PY'
          import os, yaml
          cfg = yaml.safe_load(open("skbrain.yaml"))
          author, writers = os.environ.get("AUTHOR", ""), cfg.get("writers", [])
          if author not in writers:
              print(f"::warning::PR author {author} is not in skbrain.yaml writers {writers}")
          PY
